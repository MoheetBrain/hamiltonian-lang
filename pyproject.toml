[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamiltonian-lang"
version = "0.1.0"
description = "AI-native mathematical language and semantic representation system (private research prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Hamiltonian Lang" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
# SymPy is NOT a core dependency: `equivalence/sympy_bridge.py` and the obligation
# checkers import it under `try/except ImportError` and set `SYMPY_AVAILABLE = False`,
# so the compiler runs without it. It IS required to exercise symbolic equivalence,
# counterexample search, answer equivalence, negation checking and the partiality
# obligations -- which conformance runs. CI installed only `[dev]`, so every one of those
# paths reported "sympy is not importable in this environment" and the suite failed for an
# environment reason rather than a semantic one.
#
# Pinned `>=1.14,<2`: `v1/backend_support.py` records the toolchain probe at 1.14.0 and
# the stored verifier evidence references sympy-1.14.0, so an older minor is outside the
# contract those records describe. The upper bound stops a major release changing
# simplification behaviour underneath a frozen result.
equivalence = ["sympy>=1.14,<2"]
tokenizers = ["tiktoken>=0.7"]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4",
    "hamiltonian-lang[equivalence]",
    # `evaluation/arena/budget.py::_encoder` does a bare `import tiktoken` -- deliberately
    # bare, because a silently degraded token measurement is worse than a loud failure. The
    # `tokenizers` extra already existed and `[dev]` did not pull it in, so the Arena's
    # three budget tests failed on a clean runner while passing on a long-lived local venv
    # that had accumulated the package. `.[dev]` is THE complete conformance environment:
    # every extra the suite needs belongs here, or CI turns into whack-a-mole in the
    # workflow file.
    "hamiltonian-lang[tokenizers]",
]

[project.scripts]
hml = "hamiltonian_lang.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["adversarial: cases the language must reject", "slow: long-running"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/hamiltonian_lang"]
ignore_missing_imports = true
warn_unused_ignores = false
