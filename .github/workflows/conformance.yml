name: conformance
# NOTE: this repository is private research. This workflow is provided for a private
# runner only; it must not be used to publish artefacts or results.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Conformance
        run: ./scripts/conformance.sh
