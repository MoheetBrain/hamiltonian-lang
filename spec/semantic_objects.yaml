# Semantic object catalogue for HML-L1.
# Normative companion to SPEC.md. Generated by hand; kept in sync by tests/golden.
version: hml-semantic-objects-0.1.0

object_categories:
  Symbol:
    description: A named binding with a stable identity independent of its spelling.
    identity: [depth, ordinal]      # NOT the name -- see DECISIONS.md D-005
    attributes: [declaration_kind, declared_type, stochastic, law_family]
    declaration_kinds:
      var:    A free mathematical variable.
      param:  An unknown to be inferred or fixed by the modeller.
      const:  A fixed known value.
      obs:    An observed datum. Carries epistemic status, not just a value.
      index:  A dimension or counting index.
      rv:     An explicitly declared random variable.
  Law:
    description: Relates a symbol to a probability law. Neither becomes the other.
    attributes: [role, target, given, distribution]
    roles: [law, prior, likelihood]
    constraint: A symbol has at most one law (HML-S601).
  Distribution:
    description: A probability law. Never a value of its own support.
    attributes: [family, arguments]
    argument_style: role-labelled, mandatory, unique   # D-003
  Constraint:
    description: A proposition the model must satisfy. Generates a proof obligation.
  Assumption:
    description: A proposition taken as given. Generates a proof obligation that is
      explicitly NOT discharged.
  Theorem:
    description: A claimed proposition. v0 emits a statement, never a proof.
  Objective:
    description: A scalar magnitude to be minimised or maximised.
  Inference:
    description: A query over the model. Requires the queried symbol to have a law
      when the query is a posterior.
  Concept:
    description: A minted mathematical concept.
    required_evidence: at least one invariant or example (HML-S603)
  Check:
    description: A decidable assertion the compiler itself discharges.
    kinds: [dimension, proposition, type]

primitive_relations:
  has_type:        symbol -> type
  declared_as:     symbol -> declaration_kind
  has_law:         symbol -> distribution
  family:          distribution -> family_name
  role:            distribution -> argument   # labelled by role
  conditioned_on:  symbol -> symbol
  depends_on:      symbol -> symbol
  constrains:      constraint -> symbol
  objective_of:    objective -> symbol
  queries:         inference -> symbol
  binds:           quantifier -> symbol
  scope_of:        quantifier -> quantifier   # nesting order is explicit
  member_of:       concept_member -> concept
  extends:         concept -> concept
  obligation_on:   obligation -> symbol

prohibited_conflations:
  - Distribution[T] is not a value of T
  - RandomVariable[T] is not a Distribution[T] and is not a T
  - equality (=) is not distribution (~) and is not approximation
  - implication (=>) is not correlation and is not causation
  - Probability is not PositiveReal; they are incomparable
